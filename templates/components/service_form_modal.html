<div id="add-service-modal"
     class="service-form-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="add-service-modal-title">
    <button type="button"
            class="service-form-modal__backdrop"
            popovertarget="add-service-modal"
            popovertargetaction="hide"
            aria-label="Close add service form"></button>

    <div class="service-form-modal__content">
        <button type="button"
                class="service-form-modal__close"
                popovertarget="add-service-modal"
                popovertargetaction="hide"
                aria-label="Close add service form">×</button>

        <h2 id="add-service-modal-title">Add New Service</h2>
        <form id="service-form"
              method="post"
              action="{% url 'main:create_service' %}"
              class="service-form">
            {% csrf_token %}
            {% for field in form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% for error in field.errors %}
                        <p class="form-error">{{ error }}</p>
                    {% endfor %}
                </div>
            {% endfor %}
            <div class="service-form-modal__actions">
                <button type="button"
                        class="btn"
                        popovertarget="add-service-modal"
                        popovertargetaction="hide">Cancel</button>
                <button type="submit" class="btn">Add service</button>
            </div>
        </form>
    </div>
</div>
