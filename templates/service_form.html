{% extends "base.html" %}
{% block meta %}
    <title>Add Service - {{ name }}</title>
{% endblock meta %}
{% block content %}
    <main>
        <section class="service-section">
            
                <h1>Add New Service</h1>
                <form method="post"
                      action="{% url 'main:create_service' %}"
                      class="service-form">
                    {% csrf_token %}
                    {% for field in form %}
                        <div class="form-group">
                            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                            {{ field }}
                            {% for error in field.errors %}
                                <p class="form-error">{{ error }}</p>
                            {% endfor %}
                        </div>
                    {% endfor %}
                    <button type="submit" class="btn">Add service</button>
                    <a href="{% url 'main:show_service' %}" class="btn">Cancel</a>
                </form>
            
        </section>
    </main>
{% endblock content %}
