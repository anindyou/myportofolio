{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{ name }} — Portfolio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
    {% block meta%} {% endblock meta%}
  </head>

  <body>
    <div class="hero-grid" aria-hidden="true"></div>
    <header class="navbar">
      <div class="nav-pill">
        <nav>
          <a href="{% url 'main:show_main' %}#top" class="nav-link">Profile</a>
          <a href="{% url 'main:show_main' %}#services" class="nav-link">Services</a> 
          <a href="{% url 'main:show_main' %}#experience" class="nav-link">Experience</a>
        </nav>
      </div>
    </header>
    {% block content %} {% endblock content %}

    <footer class="footer">
      <p>
        © 2026 {{ name }}. Fakultas Ilmu Komputer, Universitas
        Indonesia.
      </p>
    </footer>
  </body>
</html>
